# UART device port where Bluetooth controller is attached
UartPort = /dev/ttyTHS2

# Firmware patch file location
FwPatchFilePath = /vendor/firmware/
FwPatchFileName = mocha_bcm4350.hcd

# brcm-uim-sysfs (vendor/broadcom/fmradio UIM daemon) — keys read by
# vnd_load_conf() via vendor_conf_table[]. Stock NV libbt-vendor ignores
# unknown keys, so it is safe to share this file between both consumers.
UimUartPort = /dev/ttyTHS2
UartBaudRate = 3000000
FwPatchSettlementDelay = 200
LpmEnable = 0
LpmUseBluesleep = 0
LpmWakePolarity = 1
UseControllerBdaddr = 0

