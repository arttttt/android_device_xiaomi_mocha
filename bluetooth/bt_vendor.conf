# hardware/broadcom/libbt opens this. With BLUEDROID_ENABLE_V4L2 it is the
# chardev exposed by drivers/bluetooth/broadcom/bt_protocol_driver, not the
# underlying UART. Opening it triggers brcm_register_protocol() in the
# kernel, which kicks brcm-uim-sysfs to attach N_BRCM_HCI on ttyTHS2 and
# run download_patchram. Bluedroid then issues HCI frames straight here.
UartPort = /dev/brcm_bt_drv

# Firmware patch file location
FwPatchFilePath = /vendor/firmware/
FwPatchFileName = mocha_bcm4350.hcd

# brcm-uim-sysfs (hardware/broadcom/fmradio) — keys read by vnd_load_conf()
# via vendor_conf_table[]. Sharing the file between libbt-vendor and uim is
# fine: each parser ignores keys it does not know.
UimUartPort = /dev/ttyTHS2
UartBaudRate = 3000000
FwPatchSettlementDelay = 200
LpmEnable = 0
LpmUseBluesleep = 0
LpmWakePolarity = 1
UseControllerBdaddr = 0

