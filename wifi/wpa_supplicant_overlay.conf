# Read on top of wpa_supplicant.conf for wlan0.
#
# This used to come from hardware/broadcom/wlan's config-bcm.mk, written for
# the Nexus devices, whose bcmdhd gives P2P a network device of its own, p2p0.
# There P2P is turned off on wlan0 so that it lives on p2p0 alone. Our driver
# has no p2p0: on kernels from 3.8 it offers a P2P device instead, a wireless
# device without a network one, and the supplicant creates it itself,
# p2p-dev-wlan0, when wlan0 is added -- but only when P2P is enabled on wlan0,
# because the P2P device reads wlan0's configuration. So p2p_disabled=1 here
# was what kept Wi-Fi Direct from existing at all. The rest is as it was.
disable_scan_offload=1
wowlan_triggers=any
p2p_disabled=0
filter_rssi=-75
no_ctrl_interface=
